<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Application details — JobTrack</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app-page"><div th:replace="~{fragments/header :: *}"></div><div class="app-shell"><div th:replace="~{fragments/side :: *}"></div><main class="main-content narrow-content"><a class="back-link" href="/applications">← Back to applications</a><div class="detail-head"><div><div class="eyebrow">APPLICATION DETAILS</div><h1 th:text="${application.jobTitle}">Job title</h1><p th:text="${application.company}">Company</p></div><a class="btn btn-primary" th:href="@{/applications/{id}/edit(id=${application.id})}">Edit application ↗</a></div><section class="panel detail-panel"><div class="detail-status"><span class="status" th:classappend="${application.status.name().toLowerCase()}" th:text="${application.status}">APPLIED</span></div><div class="detail-grid"><div><small>LOCATION</small><b th:text="${application.location != null && !application.location.isBlank() ? application.location : 'Not specified'}">—</b></div><div><small>APPLIED DATE</small><b th:text="${application.appliedDate != null ? #temporals.format(application.appliedDate,'dd MMM yyyy') : 'Not specified'}">—</b></div><div><small>INTERVIEW DATE</small><b th:text="${application.interviewDate != null ? #temporals.format(application.interviewDate,'dd MMM yyyy') : 'Not scheduled'}">—</b></div><div><small>JOB POSTING</small><b th:if="${application.jobUrl != null && !application.jobUrl.isBlank()}"><a th:href="${application.jobUrl}" target="_blank" rel="noopener">Open job link ↗</a></b><b th:unless="${application.jobUrl != null && !application.jobUrl.isBlank()}">Not provided</b></div></div><div class="notes-block"><small>NOTES</small><p th:text="${application.notes != null && !application.notes.isBlank() ? application.notes : 'No notes added yet.'}">Notes</p></div><form class="delete-form" th:action="@{/applications/{id}/delete(id=${application.id})}" method="post" onsubmit="return confirm('Delete this application permanently?')"><button class="delete-link" type="submit">Delete application</button></form></section></main></div></body></html>
