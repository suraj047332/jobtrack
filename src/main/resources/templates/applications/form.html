<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Application form — JobTrack</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app-page"><div th:replace="~{fragments/header :: *}"></div><div class="app-shell"><div th:replace="~{fragments/side :: *}"></div><main class="main-content narrow-content"><div class="page-heading"><div><div class="eyebrow">KEEP YOUR SEARCH ORGANIZED</div><h1 th:text="${application.id == null ? 'Add an application' : 'Edit application'}">Add an application</h1><p>Capture the details now. Future you will be glad you did.</p></div></div><section class="panel form-panel"><form th:object="${application}" th:action="${application.id == null ? '/applications' : '/applications/' + application.id}" method="post"><div class="form-grid"><div class="form-field full"><label>Job title *</label><input th:field="*{jobTitle}" placeholder="e.g. Java Developer" required maxlength="120"><small class="field-error" th:errors="*{jobTitle}"></small></div><div class="form-field"><label>Company *</label><input th:field="*{company}" placeholder="e.g. Acme Technologies" required maxlength="120"><small class="field-error" th:errors="*{company}"></small></div><div class="form-field"><label>Location</label><input th:field="*{location}" placeholder="e.g. Pune / Remote" maxlength="120"></div><div class="form-field"><label>Application status</label><select th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div><div class="form-field"><label>Applied date</label><input type="date" th:field="*{appliedDate}"></div><div class="form-field full"><label>Job posting URL</label><input type="url" th:field="*{jobUrl}" placeholder="https://company.com/careers/job" maxlength="500"></div><div class="form-field"><label>Interview date</label><input type="date" th:field="*{interviewDate}"></div><div class="form-field full"><label>Notes</label><textarea th:field="*{notes}" rows="4" placeholder="Recruiter details, interview preparation, follow-up reminders..." maxlength="2000"></textarea></div></div><div class="form-actions"><a class="btn btn-light" href="/applications">Cancel</a><button class="btn btn-primary" type="submit" th:text="${application.id == null ? 'Save application →' : 'Update application →'}">Save application →</button></div></form></section></main></div></body></html>
