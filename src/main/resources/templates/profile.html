<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile — JobTrack</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="app-page"><div th:replace="~{fragments/header :: *}"></div><div class="app-shell"><div th:replace="~{fragments/side :: *}"></div><main class="main-content narrow-content"><div class="page-heading"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>My profile</h1><p>Manage your personal details and account security.</p></div></div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="panel form-panel profile-panel"><div class="section-title"><div class="avatar" th:text="${user.fullName.substring(0,1).toUpperCase()}">U</div><div><h2>Personal information</h2><p>Update the name associated with your account.</p></div></div><form method="post" th:action="@{/profile}"><div class="form-field"><label>Full name</label><input name="fullName" th:value="${user.fullName}" required maxlength="80"></div><div class="form-field"><label>Email address</label><input th:value="${user.email}" disabled><small class="helper">Email address cannot be changed here.</small></div><button class="btn btn-primary" type="submit">Save changes →</button></form></section><section class="panel form-panel profile-panel"><div class="section-title"><div class="avatar lock-avatar">⌑</div><div><h2>Change password</h2><p>Use a strong password you don't use elsewhere.</p></div></div><form method="post" th:action="@{/profile/password}"><div class="form-field"><label>Current password</label><input type="password" name="currentPassword" required></div><div class="form-field"><label>New password</label><input type="password" name="newPassword" minlength="8" maxlength="72" required></div><div class="form-field"><label>Confirm new password</label><input type="password" name="confirmPassword" minlength="8" maxlength="72" required></div><button class="btn btn-dark" type="submit">Update password</button></form></section><footer class="app-footer">© 2026 JobTrack <span>Keep moving forward.</span></footer></main></div></body></html>
